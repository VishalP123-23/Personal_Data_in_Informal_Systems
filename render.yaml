services:
  - type: web
    name: clinic-privacy-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-privacy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "lax"
      - key: PERSONAL_DATA_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false

databases:
  - name: clinic-privacy-db
    databaseName: clinic_privacy
    user: clinic_app
    plan: free
